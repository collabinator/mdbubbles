name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0)'
        required: true
        type: string

env:
  GO_VERSION: "1.21"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: mdbub-linux-amd64
          - goos: linux
            goarch: arm64
            output: mdbub-linux-arm64
          - goos: darwin
            goarch: amd64
            output: mdbub-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: mdbub-darwin-arm64
          - goos: windows
            goarch: amd64
            output: mdbub-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w -X 'github.com/collabinator/mdbubbles/internal/cli.version=${{ steps.get_version.outputs.version }}'" \
            -o ${{ matrix.output }} ./cmd/mdbub

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: get_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          draft: false
          prerelease: false
          files: artifacts/**/*
          body: |
            ## mdbub ${{ steps.get_version.outputs.tag_name }} - Go Edition
            
            A complete rewrite of mdbub in Go for better performance and easier distribution.
            
            ### Installation
            
            Download the appropriate binary for your platform below:
            
            - **Linux (x64)**: `mdbub-linux-amd64`
            - **Linux (ARM64)**: `mdbub-linux-arm64`
            - **macOS (Intel)**: `mdbub-darwin-amd64`
            - **macOS (Apple Silicon)**: `mdbub-darwin-arm64`
            - **Windows (x64)**: `mdbub-windows-amd64.exe`
            
            Make the binary executable and move it to your PATH:
            ```bash
            chmod +x mdbub-*
            sudo mv mdbub-* /usr/local/bin/mdbub
            ```
            
            ### What's New
            
            - Complete rewrite in Go
            - Single binary distribution
            - Faster performance
            - Lower memory usage
            - Cross-platform support
            
            See [MIGRATION.md](https://github.com/collabinator/mdbubbles/blob/main/MIGRATION.md) for migration guide from Python version.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
